name: numberama
description: A number-matching puzzle game built with Flutter and Flame.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  # Flame's effects system (MoveEffect, ScaleEffect, EffectController, ...)
  # ships inside the core `flame` package as `package:flame/effects.dart` -
  # there is no separate `flame_effects` package on pub.dev.
  flame: ^1.18.0
  flutter_riverpod: ^2.5.1
  google_fonts: ^6.2.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_local_notifications: ^22.1.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  url_launcher: ^6.3.2
  audioplayers: ^6.0.0
  share_plus: ^13.3.0
  package_info_plus: ^10.2.1
  in_app_review: ^2.0.12
  firebase_core: ^4.13.0
  firebase_analytics: ^12.4.6
  google_mobile_ads: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flame_test: ^2.2.2
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/image/icon/

# Generates android/app/src/main/res/mipmap-*/ic_launcher.png and
# ios/Runner/Assets.xcassets/AppIcon.appiconset/*.png from the same source
# image - run `dart run flutter_launcher_icons` after changing
# assets/image/icon/img.png to regenerate both platforms' icons.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/image/icon/img.png"
  # iOS rejects App Store icons with an alpha channel - the source PNG is
  # RGBA (fully opaque, but still carries the channel), so this flattens it
  # onto plain black before generating the iOS set. Android's icons keep
  # the original.
  remove_alpha_ios: true
  # Android 8+ adaptive icon: background matches the icon artwork's own
  # navy backdrop (AppColors.bgDeep) and the foreground is the same image,
  # letterboxed to size in the same navy - launcher masks on the two round
  # tiles read fine, so no separate padded/transparent foreground asset is
  # needed here.
  adaptive_icon_background: "#0D1024"
  adaptive_icon_foreground: "assets/image/icon/img.png"
